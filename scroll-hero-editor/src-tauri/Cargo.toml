[package]
name = "app"
version = "0.1.0"
description = "Scroll Hero Editor — desktop shell"
authors = ["John Snel"]
license = ""
repository = "https://github.com/snelbops/Music-Reactive-Scroll-Hero-Editor"
edition = "2021"
# Tauri itself only needs 1.77.2, but a transitive dependency in Cargo.lock (time-core)
# uses the 2024 edition, which cargo did not stabilise until 1.85. Without this line the
# failure surfaces as "feature `edition2024` is required" against an unfamiliar crate
# rather than as a toolchain-too-old message.
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
