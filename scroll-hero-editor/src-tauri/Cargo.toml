[package]
name = "scroll-hero-editor"
version = "1.9.0"
description = "Scroll Hero Editor"
authors = ["snelbops"]
edition = "2021"
rust-version = "1.77.2"

# The binary is a thin shim over this library, which is the layout `tauri dev` expects.
# Native work — ffmpeg, MIDI, disk-backed media — would go in here.
[lib]
name = "scroll_hero_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
